plugins {
  id 'org.jetbrains.kotlin.jvm' version '2.2.20'
  id 'com.gradleup.shadow' version '9.4.1'
}

group = 'whilestevego'
version = '0.2.0'

def kotlinLspVersion = project.property('kotlinLspVersion')
def pluginsJarDir = layout.buildDirectory.dir("kotlin-plugins")
def pluginsJar = pluginsJarDir.map { it.file("language-server-plugins-kotlin.jar") }

// Companion JARs from plugins/kotlin/lib/ that inspection classes depend on.
def inspectionCompanionJarNames = [
  'intellij.kotlin.codeInsight.api.jar',       // AbstractKotlinInspection, KotlinApplicableInspectionBase
  'intellij.kotlin.codeInsight.shared.jar',    // MayBeConstantInspectionBase, EnumValuesSoftDeprecateInspectionBase
  'intellij.kotlin.base.codeInsight.jar',      // PsiOnlyKotlinMainFunctionDetector
  'intellij.kotlin.codeInsight.utils.jar',     // PropertyModifierUtilsKt
  'intellij.kotlin.base.psi.jar',              // TextRangeUtilsKt
  'intellij.kotlin.base.projectStructure.jar', // LanguageVersionSettingsProviderUtils
  'intellij.kotlin.base.util.jar',             // CollectionUtilsKt
  'intellij.kotlin.base.analysis.utils.jar',   // SymbolUtilsKt
  'kotlin.fir.frontend-independent.jar',       // RenameIdentifierFix, AddConstModifierFix
]

// IntelliJ Platform JARs from lib/ (build 262) that provide APIs not present in kotlin-compiler's
// bundled platform version.  Loaded with child-first delegation so they override the older bundled
// version; only ActionsKt (listed in InspectionRunner.InspectionClassLoader) is affected.
def inspectionPlatformJarNames = [
  'intellij.platform.core.jar',  // ActionsKt.runReadAction
]

tasks.register('downloadKotlinPluginsJar') {
  outputs.file(pluginsJar)
  (inspectionCompanionJarNames + inspectionPlatformJarNames).each { name ->
    outputs.file(pluginsJarDir.map { it.file(name) })
  }
  doLast {
    def dir = pluginsJarDir.get().asFile
    dir.mkdirs()
    def allPluginJarNames = ['language-server-plugins-kotlin.jar'] + inspectionCompanionJarNames
    def allJarNames = allPluginJarNames + inspectionPlatformJarNames
    def allExist = allJarNames.every { new File(dir, it).exists() }
    if (allExist) return

    def url = "https://download-cdn.jetbrains.com/kotlin-lsp/${kotlinLspVersion}/kotlin-server-${kotlinLspVersion}.tar.gz"
    def tmp = File.createTempFile("kotlin-server", ".tar.gz")
    try {
      new URL(url).withInputStream { input -> tmp << input }
      def tmpDir = java.nio.file.Files.createTempDirectory("kotlin-server").toFile()
      try {
        def pluginPaths = allPluginJarNames.collect { "kotlin-server-${kotlinLspVersion}/plugins/kotlin/lib/${it}" }
        def platformPaths = inspectionPlatformJarNames.collect { "kotlin-server-${kotlinLspVersion}/lib/${it}" }
        (["tar", "-xzf", tmp.absolutePath, "-C", tmpDir.absolutePath] + pluginPaths + platformPaths).execute().waitFor()
        allPluginJarNames.each { name ->
          def src = new File(tmpDir, "kotlin-server-${kotlinLspVersion}/plugins/kotlin/lib/${name}")
          new File(dir, name).bytes = src.bytes
        }
        inspectionPlatformJarNames.each { name ->
          def src = new File(tmpDir, "kotlin-server-${kotlinLspVersion}/lib/${name}")
          new File(dir, name).bytes = src.bytes
        }
      } finally { tmpDir.deleteDir() }
    } finally { tmp.delete() }
  }
}

def pluginsJarResourceDir = layout.buildDirectory.dir("generated-resources")

tasks.register('copyKotlinPluginsJarToResources', Copy) {
  dependsOn downloadKotlinPluginsJar
  from pluginsJarDir
  include 'language-server-plugins-kotlin.jar'
  inspectionCompanionJarNames.each { include it }
  inspectionPlatformJarNames.each { include it }
  into pluginsJarResourceDir.map { it.dir("whilestevego/krit/engine") }
}

processResources.dependsOn copyKotlinPluginsJarToResources

sourceSets {
  main {
    resources {
      srcDir pluginsJarResourceDir
    }
  }
  integrationTest {
    kotlin.srcDir 'src/integrationTest/kotlin'
    compileClasspath += sourceSets.main.output + configurations.testRuntimeClasspath
    runtimeClasspath += output + compileClasspath
  }
}

configurations {
  integrationTestImplementation.extendsFrom testImplementation
}

repositories {
  mavenCentral()
  // Analysis API -for-ide artifacts are hosted here, not on Maven Central.
  maven { url "https://packages.jetbrains.team/maven/p/ij/intellij-dependencies/" }
}

dependencies {
  // kotlin-compiler (non-embeddable) provides:
  //   - the FIR analysis pipeline
  //   - unshaded IntelliJ Platform core (com.intellij.*) needed by the Analysis API
  // We use the non-embeddable variant because the embeddable shades com.intellij.* to
  // org.jetbrains.kotlin.com.intellij.*, which is incompatible with the Analysis API.
  implementation "org.jetbrains.kotlin:kotlin-compiler:2.3.21"

  // Analysis API -for-ide artifacts: each is a fat JAR whose transitive deps are bundled
  // inside it; the POMs reference artifacts that are not separately published, so we
  // disable transitive resolution to avoid spurious "not found" errors.
  //
  // The full XML-include chain that the plugin loader resolves at startup:
  //   analysis-api-fir-standalone-base.xml (standalone-for-ide)
  //     → analysis-api-fir.xml (k2-for-ide)
  //         → analysis-api-impl-base.xml (impl-base-for-ide)
  //             → analysis-api-platform-interface.xml (platform-interface-for-ide)
  //             → /META-INF/extensions/compiler.xml (kotlin-compiler)
  //         → low-level-api-fir.xml (low-level-api-fir-for-ide)
  //             → analysis-api-platform-interface.xml (platform-interface-for-ide)
  //             → /META-INF/extensions/compiler.xml (kotlin-compiler)
  //         → symbol-light-classes.xml (symbol-light-classes-for-ide)
  implementation("org.jetbrains.kotlin:analysis-api-standalone-for-ide:2.3.21") { transitive = false }
  implementation("org.jetbrains.kotlin:analysis-api-for-ide:2.3.21") { transitive = false }
  implementation("org.jetbrains.kotlin:analysis-api-k2-for-ide:2.3.21") { transitive = false }
  implementation("org.jetbrains.kotlin:analysis-api-impl-base-for-ide:2.3.21") { transitive = false }
  implementation("org.jetbrains.kotlin:low-level-api-fir-for-ide:2.3.21") { transitive = false }
  implementation("org.jetbrains.kotlin:symbol-light-classes-for-ide:2.3.21") { transitive = false }
  implementation("org.jetbrains.kotlin:analysis-api-platform-interface-for-ide:2.3.21") { transitive = false }

  // Runtime dependencies required by Analysis API classes bundled in the -for-ide fat JARs
  // (not declared in those POMs, must be supplied explicitly).
  // XmlElement.<clinit> references kotlinx.serialization.KSerializer.
  implementation 'org.jetbrains.kotlinx:kotlinx-serialization-core-jvm:1.9.0'
  // KotlinCachingPackageProviderFactory and related caches use Caffeine.
  implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

  // IntelliJ platform inspection API (InspectionManager, ProblemsHolder, LocalInspectionTool, etc.)
  implementation("com.jetbrains.intellij.platform:analysis:241.194") { transitive = false }
  // InvalidDataException is referenced by InspectionProfileEntry (superclass of LocalInspectionTool)
  // and must be on the fat JAR classloader's path for reflection-based constructor resolution.
  implementation("com.jetbrains.intellij.platform:util:241.194") { transitive = false }

  implementation 'com.github.ajalt.clikt:clikt:4.4.0'
  implementation 'org.yaml:snakeyaml:2.2'

  testImplementation 'io.kotest:kotest-runner-junit5:5.9.1'
  testImplementation 'io.kotest:kotest-assertions-core:5.9.1'
  testImplementation 'io.mockk:mockk:1.13.12'
  testImplementation 'org.jetbrains.kotlinx:kotlinx-serialization-json:1.9.0'

}

java {
  toolchain {
    languageVersion = JavaLanguageVersion.of(25)
  }
  sourceCompatibility = JavaVersion.VERSION_21
  targetCompatibility = JavaVersion.VERSION_21
}

kotlin {
  compilerOptions {
    jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_21
    // allWarningsAsErrors intentionally omitted: this module calls KotlinCoreEnvironment (K1 API)
    // which carries a "planned to deprecate" notice in 2.2.x. Once the K2 standalone analysis
    // API stabilises this module can be migrated and the flag re-enabled.
  }
}

shadowJar {
  archiveBaseName = 'krit'
  archiveVersion = ''
  archiveClassifier = ''
  // First-wins: project classes are added before dependency JARs, so our replacement
  // com.intellij.util.containers.Unsafe (uses jdk.internal.misc.Unsafe, not deprecated)
  // shadows the one from kotlin-compiler that calls sun.misc.Unsafe.
  duplicatesStrategy = DuplicatesStrategy.EXCLUDE
  mergeServiceFiles()
  manifest {
    attributes 'Main-Class': 'whilestevego.krit.MainKt'
  }
  // Exclude kotlin-compiler-embeddable's own signature files to avoid conflicts.
  exclude 'META-INF/*.SF'
  exclude 'META-INF/*.DSA'
  exclude 'META-INF/*.RSA'
}

assemble.dependsOn shadowJar

test {
  useJUnitPlatform()
  // PsiEngine requires access to jdk.internal.misc.Unsafe (same flags as bin/krit)
  jvmArgs(
    '--enable-native-access=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
  )
  testLogging {
    showStandardStreams = true
  }
}

tasks.register('integrationTest', Test) {
  testClassesDirs = sourceSets.integrationTest.output.classesDirs
  // main.output must precede kotlin-compiler.jar (which arrives early via mockk's transitive deps)
  // so the project's com.intellij.util.containers.UtilKt shadow wins over the bundled platform version.
  classpath = files(sourceSets.main.output) + sourceSets.integrationTest.runtimeClasspath
  useJUnitPlatform()
  jvmArgs(
    '--enable-native-access=ALL-UNNAMED',
    '--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
  )
  testLogging {
    showStandardStreams = true
  }
}

tasks.register('writeCompileClasspath') {
  dependsOn configurations.runtimeClasspath
  def outFile = layout.buildDirectory.file('compile-classpath.txt')
  outputs.file(outFile)
  doLast {
    outFile.get().asFile.text = configurations.runtimeClasspath.files
      .collect { it.absolutePath }
      .join(File.pathSeparator)
  }
}

shadowJar.dependsOn writeCompileClasspath
