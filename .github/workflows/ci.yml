name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  build-and-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew shadowJar

      - name: Analyze with krit
        run: bin/krit --input src/main/kotlin --common-checks --fail-on-severity ERROR
