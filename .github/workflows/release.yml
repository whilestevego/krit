name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Build
        run: ./gradlew shadowJar

      - name: Extract changelog
        run: |
          TAG=${GITHUB_REF_NAME}
          awk "/^## ${TAG}/{found=1; next} found && /^## /{exit} found{print}" CHANGELOG.md > notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "krit $GITHUB_REF_NAME" \
            --notes-file notes.md \
            build/libs/krit.jar
